<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LodgeHub - Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
}

.navbar{
    background:#0f172a;
    color:white;
    padding:15px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:inline-flex;
    align-items:center;
    gap:12px;
    font-size:24px;
    font-weight:bold;
}

.site-logo {
    width:40px;
    height:auto;
    border-radius:10px;
}

.navbar a:hover{
    background:#2563eb;
}

.container{
    width:100%;
    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.form-box{
    background:white;
    width:450px;
    padding:35px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.form-box h2{
    text-align:center;
    margin-bottom:25px;
    color:#0f172a;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
}

.input-group input:focus{
    border-color:#2563eb;
}

.terms{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
    margin-bottom:20px;
}

.btn{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.btn:hover{
    background:#1d4ed8;
}

.login-link{
    text-align:center;
    margin-top:15px;
}

.login-link a{
    color:#2563eb;
    text-decoration:none;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>
</head>

<body>

<nav class="navbar">
    <a href="/" class="logo">
        LodgeHub
    </a>
    <a href="/">Home</a>
</nav>

<div class="container">
    <div class="form-box">

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="first_name" required>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <input type="text" id="mobile_number" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm_password" required>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <span>I agree to the Terms & Conditions</span>
            </div>

            <button type="submit" class="btn">
                Register
            </button>

            <div id="message"></div>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login Here</a>
            </div>

        </form>

    </div>
</div>

{% load static %}
<script src="{% static 'js/register.js' %}"></script>

</body>
</html>
