version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: lodgehub_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: lodgehub_django
    command: sh -c "sleep 25 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "114:8000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  mysql_data: